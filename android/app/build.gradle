plugins { id 'com.android.application' }
android {
    namespace 'ru.neochoice.bbsflash'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'ru.neochoice.bbsflash.preview'
        minSdk 26
        targetSdk 36
        versionCode 3
        buildConfigField 'boolean', 'DIAGNOSTICS_UPLOAD', 'false'
        versionName '0.3.0-rc1'
        testInstrumentationRunner 'ru.neochoice.bbsflash.HistoryInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/assets'))
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
tasks.register('bundleSite', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'android/scripts/bundle-site.cjs'
    inputs.files(fileTree('../../src'), fileTree('../../assets'), file('../../package.json'), file('../../docs/CREDITS.md'), file('../../bbs-flash.html'), file('../../index.html'), fileTree('../bridge'), file('../scripts/bundle-site.cjs'), fileTree('..') { include '*.txt' })
    outputs.dir(layout.buildDirectory.dir('generated/assets'))
}
tasks.named('preBuild').configure { dependsOn('bundleSite') }
